<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Payroll Otomatis</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <!-- Header / Navbar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-indigo-600 text-white rounded-lg">
          <i data-lucide="wallet"></i>
        </div>
        <h1 class="font-bold text-xl text-slate-900">Payroll System</h1>
      </div>
      <button onclick="fetchPayrollData()" class="flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-medium px-4 py-2 rounded-lg transition text-sm">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i> Synchronize Data
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Stat Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Pengeluaran Gaji</p>
        <h3 id="stat-total" class="text-3xl font-bold text-slate-900 mt-2">Rp 0</h3>
      </div>
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Karyawan / Tutor</p>
        <h3 id="stat-count" class="text-3xl font-bold text-indigo-600 mt-2">0</h3>
      </div>
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Status Pembayaran</p>
        <h3 id="stat-status" class="text-3xl font-bold text-emerald-600 mt-2">Ready</h3>
      </div>
    </div>

    <!-- Controls / Search -->
    <div class="flex flex-col sm:flex-row justify-between gap-4 mb-6">
      <input type="text" id="search-input" onkeyup="filterData()" placeholder="Cari nama karyawan atau jabatan..." class="w-full sm:w-80 px-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
      <div class="text-xs text-slate-500 self-center">
        *Data terhubung langsung dengan Google Sheets
      </div>
    </div>

    <!-- Data Table -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-100/70 border-b border-slate-200 text-xs font-semibold uppercase text-slate-500">
              <th class="p-4">Nama</th>
              <th class="p-4">Jabatan</th>
              <th class="p-4">Gaji Pokok</th>
              <th class="p-4">Tunjangan</th>
              <th class="p-4">Potongan</th>
              <th class="p-4">Total Diterima</th>
              <th class="p-4">Status</th>
            </tr>
          </thead>
          <tbody id="payroll-table-body" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="7" class="p-8 text-center text-slate-400">Memuat data dari Google Sheets...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
